<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Megha Kumari – Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Megha Kumari, full-stack developer: projects, experience, education, skills and contact." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
/* Layout concept: a deep-sea navy sidebar that stays in view (profile, nav, links) beside a pale,
   airy content column. Sections are open rows and rules instead of boxed cards. Teal leads, coral is a spark. */

:root {
  --bg: #f0f6f7;
  --surface: #ffffff;
  --ink: #0c2b3a;
  --muted: #526d79;
  --line: #d3e2e6;
  --teal: #0b8f9c;
  --teal-deep: #0a5f6e;
  --teal-glow: #54d6e0;
  --coral: #ff6a55;
  --navy: #0c2b3a;
  --navy-text: #e6f2f4;
  --navy-muted: #8fb2bc;

  --font-display: "Sora", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Fira Code", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --side-w: 18rem;
  --gutter: clamp(1.1rem, 5vw, 3.5rem);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--teal); color: #fff; }

.label { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal-deep); }
svg.ico { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; padding-inline: var(--gutter); }
.main > * { max-width: 52rem; margin-inline: auto; }

/* ---------- Sidebar ---------- */
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--navy); color: var(--navy-text);
  padding: 2.25rem 1.75rem; display: flex; flex-direction: column; gap: 2rem;
  background-image: radial-gradient(18rem 14rem at 0% 0%, rgba(84, 214, 224, 0.14), transparent 70%);
}
.side-top { display: block; }
.who { display: grid; gap: 1.1rem; justify-items: start; }
.avatar {
  width: 7.5rem; height: 7.5rem; border-radius: 50%; overflow: hidden;
  background: linear-gradient(145deg, var(--teal), var(--teal-deep));
  border: 3px solid rgba(84, 214, 224, 0.5);
  display: grid; place-items: center;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar span { font-family: var(--font-display); font-weight: 700; font-size: 2rem; color: #fff; letter-spacing: -0.02em; }
.who-text b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
.who-text small { display: block; margin-top: 0.3rem; font-size: 0.85rem; color: var(--navy-muted); }
.menu-btn { display: none; }
.side-panel { display: flex; flex-direction: column; gap: 1.75rem; flex: 1; }
.status {
  display: inline-flex; align-items: center; gap: 0.5rem; align-self: flex-start;
  font-size: 0.78rem; font-weight: 600; padding: 0.35rem 0.8rem; border-radius: 999px;
  background: rgba(84, 214, 224, 0.12); border: 1px solid rgba(84, 214, 224, 0.3);
}
.status i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #3be28d; box-shadow: 0 0 0 0 rgba(59, 226, 141, 0.5); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 70%, 100% { box-shadow: 0 0 0 0.5rem transparent; } }
.side-nav { display: grid; gap: 0.1rem; }
.side-nav a {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.45rem 0;
  font-size: 0.95rem; font-weight: 500; color: var(--navy-muted); transition: color 0.2s, gap 0.2s;
}
.side-nav a::before { content: ""; width: 0.5rem; height: 2px; background: currentColor; opacity: 0.5; transition: width 0.2s, background 0.2s, opacity 0.2s; }
.side-nav a:hover { color: var(--navy-text); }
.side-nav a.active { color: var(--teal-glow); }
.side-nav a.active::before { width: 1.4rem; background: var(--coral); opacity: 1; }
.side-links { margin-top: auto; display: grid; gap: 0.4rem; font-family: var(--font-mono); font-size: 0.8rem; }
.side-links a { color: var(--navy-muted); }
.side-links a:hover { color: var(--teal-glow); }

/* ---------- Hero ---------- */
.hero { padding-top: clamp(3rem, 9vw, 6.5rem); padding-bottom: clamp(2rem, 5vw, 3.5rem); }
.hero h1 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08;
  font-size: clamp(2.2rem, 5.6vw, 3.6rem); margin-top: 1.1rem; text-wrap: balance;
}
.hero h1 em {
  font-style: normal; color: var(--teal);
  background: linear-gradient(var(--coral), var(--coral)) 0 100% / 100% 0.14em no-repeat; padding-bottom: 0.06em;
}
.lead { margin-top: 1.5rem; max-width: 38rem; color: var(--muted); font-size: 1.08rem; text-wrap: pretty; }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2rem; }
.btn {
  display: inline-block; cursor: pointer; font-weight: 700; font-size: 0.95rem; padding: 0.8rem 1.4rem;
  border-radius: 999px; border: 2px solid var(--ink); transition: transform 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
}
.btn.solid { background: var(--ink); color: #fff; }
.btn.solid:hover { background: var(--teal-deep); border-color: var(--teal-deep); transform: translateY(-2px); }
.btn.line { background: transparent; color: var(--ink); }
.btn.line:hover { background: var(--ink); color: #fff; }
.figures { display: flex; flex-wrap: wrap; gap: 1.25rem 3rem; margin-top: 2.75rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.figures div { display: flex; flex-direction: column-reverse; gap: 0.2rem; }
.figures dt { font-size: 0.82rem; color: var(--muted); }
.figures dd { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--teal-deep); }

/* ---------- Blocks ---------- */
.block { padding-block: clamp(2.5rem, 6vw, 4rem); border-top: 1px solid var(--line); scroll-margin-top: 1rem; }
.title { display: grid; gap: 0.5rem; margin-bottom: 2rem; }
.title h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 3.6vw, 2.2rem); letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }

.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 2.5rem; }
.prose p { color: var(--muted); margin-bottom: 1rem; text-wrap: pretty; }
.prose p:last-child { margin-bottom: 0; }
.glance { display: grid; gap: 0; border-top: 1px solid var(--line); align-self: start; }
.glance div { padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
.glance dt { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal-deep); }
.glance dd { margin-top: 0.15rem; font-size: 0.95rem; text-wrap: pretty; }

/* Rows: experience and education */
.rows { display: grid; gap: 2rem; }
.row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.5rem 1.5rem; }
.when { font-family: var(--font-mono); font-size: 0.82rem; color: var(--teal-deep); padding-top: 0.3rem; }
.row h3 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
.org { color: var(--muted); font-size: 0.93rem; margin-top: 0.1rem; }
.dots { display: grid; gap: 0.5rem; margin-top: 0.9rem; }
.dots li { position: relative; padding-left: 1.2rem; color: var(--muted); font-size: 0.95rem; text-wrap: pretty; }
.dots li::before { content: ""; position: absolute; left: 0; top: 0.7em; width: 0.5rem; height: 2px; background: var(--coral); }
.edu-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 1.5rem; }
.score { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; color: var(--teal-deep); background: #dcf0f2; padding: 0.15rem 0.7rem; border-radius: 6px; white-space: nowrap; }

/* Projects */
.projects { display: grid; gap: 1.5rem; }
.project {
  background: var(--surface); border: 1px solid var(--line); border-left-width: 6px; border-radius: 6px 16px 16px 6px;
  padding: 1.6rem 1.75rem; transition: transform 0.25s, box-shadow 0.25s; min-width: 0;
}
.project:hover { transform: translateX(4px); box-shadow: 0 16px 36px -22px rgba(12, 43, 58, 0.45); }
.project.c0 { border-left-color: var(--teal); }
.project.c1 { border-left-color: var(--coral); }
.project.c2 { border-left-color: var(--ink); }
.p-meta { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; font-family: var(--font-mono); font-size: 0.76rem; color: var(--teal-deep); }
.p-meta .note { color: var(--muted); }
.p-meta .note::before { content: "·"; margin-right: 0.9rem; color: var(--line); }
.project h3 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; line-height: 1.3; margin-top: 0.7rem; }
.project p { color: var(--muted); font-size: 0.95rem; margin-top: 0.7rem; text-wrap: pretty; }
.tags { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 1.1rem; }
.tags li { font-family: var(--font-mono); font-size: 0.76rem; padding: 0.22rem 0.65rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--teal-deep); }
.bg-note { display: none; }
.more { display: inline-block; margin-top: 1.1rem; font-family: var(--font-mono); font-size: 0.82rem; font-weight: 500; color: var(--ink); border-bottom: 2px solid var(--coral); }
.more:hover { color: var(--teal-deep); }

/* Skills */
.skill-rows { display: grid; }
.skill-row { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 0.6rem 1.5rem; padding-block: 1.1rem; border-bottom: 1px solid var(--line); }
.skill-row:first-child { padding-top: 0; }
.skill-row h3 { display: flex; align-items: flex-start; gap: 0.6rem; font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; color: var(--ink); padding-top: 0.2rem; }
.skill-row h3 .ico { color: var(--coral); margin-top: 0.2rem; }
.skill-row .tags { margin-top: 0; }
.skill-row .tags li { background: var(--surface); }
.skill-row .tags li:hover { border-color: var(--teal); }

/* Awards */
.awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 2rem; }
.awards li { display: flex; gap: 1rem; align-items: flex-start; min-width: 0; }
.tile { width: 2.6rem; height: 2.6rem; border-radius: 12px; background: #dcf0f2; color: var(--teal-deep); display: grid; place-items: center; flex: none; }
.awards h3 { font-family: var(--font-display); font-size: 0.98rem; font-weight: 600; line-height: 1.3; }
.awards p { color: var(--muted); font-size: 0.86rem; margin-top: 0.2rem; }

/* Contact */
.contact { border-top: 0; }
.contact-panel {
  background: var(--navy); color: var(--navy-text); border-radius: 24px; padding: clamp(1.5rem, 4vw, 2.75rem);
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 2.25rem;
  background-image: radial-gradient(22rem 16rem at 100% 0%, rgba(84, 214, 224, 0.16), transparent 70%);
}
.contact-info .label { color: var(--teal-glow); }
.contact-info h2 { font-family: var(--font-display); font-size: clamp(1.7rem, 3.6vw, 2.3rem); letter-spacing: -0.02em; line-height: 1.15; margin-top: 0.6rem; }
.contact-info p { color: var(--navy-muted); margin-top: 0.9rem; text-wrap: pretty; }
.c-list { display: grid; gap: 0.2rem; margin-top: 1.5rem; }
.c-list a { display: flex; align-items: center; gap: 0.9rem; padding: 0.6rem 0; color: var(--navy-text); font-size: 0.93rem; font-weight: 600; overflow-wrap: anywhere; }
.c-list a .ico { color: var(--coral); }
.c-list small { display: block; font-size: 0.72rem; font-weight: 500; color: var(--navy-muted); }
.c-list a:hover { color: var(--teal-glow); }
form { display: grid; gap: 1rem; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 1.5rem; min-width: 0; }
.f-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
label { display: grid; gap: 0.35rem; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.85rem; font-size: 0.92rem; font-weight: 500; }
input::placeholder, textarea::placeholder { color: #8aa2ab; }
input:focus, textarea:focus { outline: none; border-color: var(--teal); background: #fff; }
textarea { resize: vertical; min-height: 7rem; }
form .btn { width: 100%; text-align: center; }
.form-note { font-size: 0.78rem; color: var(--muted); min-height: 1.2em; }

.footer { padding-block: 1.75rem 2.5rem; font-size: 0.82rem; color: var(--muted); font-family: var(--font-mono); }

/* ---------- Narrow screens ---------- */
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 0; z-index: 40; height: auto; max-height: 100vh; padding: 0.75rem var(--gutter); gap: 0; }
  .side-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .who { grid-auto-flow: column; align-items: center; gap: 0.8rem; }
  .avatar { width: 2.6rem; height: 2.6rem; border-width: 2px; }
  .avatar span { font-size: 1rem; }
  .who-text b { font-size: 1rem; }
  .who-text small { display: none; }
  .menu-btn {
    display: inline-block; background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: var(--navy-text);
    border-radius: 999px; padding: 0.35rem 0.9rem; font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer;
  }
  .side-panel { display: none; padding-block: 1.25rem 0.5rem; gap: 1.25rem; }
  .side.open .side-panel { display: flex; }
  .side-links { margin-top: 0; grid-auto-flow: column; justify-content: start; gap: 1.5rem; }
  .block { scroll-margin-top: 4.5rem; }
}
@media (max-width: 720px) {
  .two, .contact-panel { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr); }
  .when { padding-top: 0; }
  .skill-row { grid-template-columns: minmax(0, 1fr); }
  .awards { grid-template-columns: minmax(0, 1fr); }
  .f-row { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .status i { animation: none; }
  .btn, .project { transition: none; }
}

</style>
</head>

function Sidebar() {
  const [active, setActive] = useState("");
  const [open, setOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => {
      let current = "";
      for (const [id] of SECTIONS) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 160) current = id;
      }
      setActive(current);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <aside className={"side" + (open ? " open" : "")}>
      <div className="side-top">
        <a className="who" href="#top" onClick={() => setOpen(false)}>
          <Avatar />
          <span className="who-text">
            <b>{PROFILE.name.join(" ")}</b>
            <small>{PROFILE.eyebrow}</small>
          </span>
        </a>
        <button
          className="menu-btn"
          type="button"
          aria-expanded={open}
          aria-controls="side-panel"
          onClick={() => setOpen(!open)}
        >
          {open ? "Close" : "Menu"}
        </button>
      </div>

      <div className="side-panel" id="side-panel">
        <span className="status"><i aria-hidden="true" />{PROFILE.status}</span>
        <nav aria-label="Main">
          <ul className="side-nav">
            {SECTIONS.map(([id, label]) => (
              <li key={id}>
                <a
                  href={"#" + id}
                  className={active === id ? "active" : ""}
                  onClick={() => setOpen(false)}
                >
                  {label}
                </a>
              </li>
            ))}
          </ul>
        </nav>
        <div className="side-links">
          <a href={PROFILE.github} target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          <a href={PROFILE.linkedin} target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
          <a href={"mailto:" + PROFILE.email}>Email ↗</a>
        </div>
      </div>
    </aside>
  );
}

function Contact() {
  const [note, setNote] = useState("");

  const onSubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = `${f.get("message")}\n\nFrom: ${f.get("name")} (${f.get("email")})`;
    const url =
      "mailto:" + PROFILE.email +
      "?subject=" + encodeURIComponent(f.get("subject") || "Portfolio message") +
      "&body=" + encodeURIComponent(body);
    setNote("Opening your email app. If nothing opens, write to " + PROFILE.email + ".");
    window.location.href = url;
  };

  const items = [
    ["mail", "Email", PROFILE.email, "mailto:" + PROFILE.email],
    ["phone", "Phone", PROFILE.phone, "tel:" + PROFILE.phone.replace(/\s/g, "")],
    ["link", "LinkedIn", PROFILE.linkedinLabel, PROFILE.linkedin],
    ["branch", "GitHub", PROFILE.githubLabel, PROFILE.github],
  ];

  return (
    <section className="block contact" id="contact">

          <h2>Let's work together.</h2>

                  <span><small>{label}</small>{value}</span>
                </a>
              </li>
            ))}

        </div>
        <form onSubmit={onSubmit}>
          <div className="f-row">
            <label htmlFor="f-name">Name

            </label>
            <label htmlFor="f-email">Email
              <input id="f-email" name="email" type="email" placeholder="you@email.com" required />
            </label>
          </div>
          <label htmlFor="f-subject">Subject
            <input id="f-subject" name="subject" placeholder="What's this about?" />
          </label>
          <label htmlFor="f-message">Message
            <textarea id="f-message" name="message" placeholder="Tell me more..." required />

  );
}
